# Host nginx vhost for the Interview Copilot. New file; does not touch other vhosts.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled,
# issue the cert (certbot --nginx -d interview.bountyai.online or the host's
# existing method), `nginx -t`, then `systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name interview.bountyai.online;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name interview.bountyai.online;

    ssl_certificate     /etc/letsencrypt/live/interview.bountyai.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interview.bountyai.online/privkey.pem;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Token-streamed suggestions (SSE): no buffering.
    location /api/interview/live/stream {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
