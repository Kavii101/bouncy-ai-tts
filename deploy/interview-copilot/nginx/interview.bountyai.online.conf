# Host nginx vhost for the Interview Copilot. New file; touches no other vhost.
# Every name here is unique to this app, so it cannot collide with another site.
#
# Basic auth is REQUIRED while the app has no login: without it anyone with the
# URL can read the shared workspace and spend the provider budget.

limit_req_zone $binary_remote_addr zone=interview_copilot_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name interview.bountyai.online;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name interview.bountyai.online;

    ssl_certificate     /etc/letsencrypt/live/interview.bountyai.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interview.bountyai.online/privkey.pem;

    auth_basic "BountyAI staging";
    auth_basic_user_file /etc/nginx/interview-copilot.htpasswd;

    client_max_body_size 50m;

    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self)" always;

    # nginx drops inherited proxy_set_header as soon as a block sets its own, so
    # each location must list the full set.
    location /api/interview/live/stream {
        limit_req zone=interview_copilot_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=interview_copilot_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
