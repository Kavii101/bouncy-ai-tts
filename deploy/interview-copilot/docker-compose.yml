# Interview Copilot on the VPS. Fully isolated from the monorepo's `bai` project:
# own project name, own network, own MySQL (not published to the host).
# Usage (on the VPS, in this directory, with .env next to this file):
#   docker compose -p interview-copilot pull
#   docker compose -p interview-copilot run --rm migrate
#   docker compose -p interview-copilot up -d web
name: interview-copilot

services:
  mysql:
    image: mysql:8.4
    container_name: interview-copilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interview
      MYSQL_USER: interview
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [interview-copilot-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  migrate:
    image: ${IMAGE:-ghcr.io/kavii101/interview-copilot:latest}
    profiles: [tools]
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: mysql://interview:${MYSQL_PASSWORD}@mysql:3306/interview
    depends_on:
      mysql: { condition: service_healthy }
    networks: [interview-copilot-net]

  web:
    image: ${IMAGE:-ghcr.io/kavii101/interview-copilot:latest}
    container_name: interview-copilot-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3020}
      DATABASE_URL: mysql://interview:${MYSQL_PASSWORD}@mysql:3306/interview
    ports:
      # Loopback only; host nginx terminates TLS and proxies here.
      - "127.0.0.1:${APP_PORT:-3020}:${APP_PORT:-3020}"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [interview-copilot-net]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }

networks:
  interview-copilot-net:
    name: interview-copilot-net

volumes:
  mysql-data:
    name: interview-copilot-mysql-data
