name: image

on:
  push:
    branches: [feat/interview-copilot, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kavii101/interview-copilot:${{ github.sha }}
            ghcr.io/kavii101/interview-copilot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The VPS cannot pull this private package and must not have its shared
      # ghcr.io login replaced, so the image also ships as a downloadable tar.
      - name: Export image tar
        run: |
          docker pull ghcr.io/kavii101/interview-copilot:${{ github.sha }}
          docker save ghcr.io/kavii101/interview-copilot:${{ github.sha }} | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: image.tar.gz
          retention-days: 14
          compression-level: 0
