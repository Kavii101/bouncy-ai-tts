<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#f7f8fb"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Interview Copilot — how a live answer is produced</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#64748b">The expensive work happens once, before the interview. Each question then costs a single LLM round-trip.</text>

  <!-- ============ PREPARE BAND (one-time) ============ -->
  <rect x="40" y="84" width="1120" height="118" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="110" font-size="13" font-weight="700" fill="#4338ca">ONE-TIME · BEFORE THE INTERVIEW   —   cached, no LLM at question time</text>

  <!-- JD + Resume -->
  <rect x="64" y="124" width="200" height="60" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="164" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">JD + Résumé</text>
  <text x="164" y="168" text-anchor="middle" font-size="11" fill="#64748b">pasted into Setup</text>

  <line x1="264" y1="154" x2="300" y2="154" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- extractBrief -->
  <rect x="300" y="124" width="224" height="60" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="508" cy="138" r="5" fill="#059669"/>
  <text x="412" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">extractBrief() → LLM</text>
  <text x="412" y="168" text-anchor="middle" font-size="11" fill="#64748b">strict JSON · untrusted-data prompt</text>

  <line x1="524" y1="154" x2="560" y2="154" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Brief -->
  <rect x="560" y="124" width="300" height="60" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="844" cy="138" r="5" fill="#059669"/>
  <text x="710" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Structured Brief  (interview_briefs)</text>
  <text x="710" y="167" text-anchor="middle" font-size="11" fill="#64748b">requirements · evidence map · gaps · questions</text>

  <line x1="860" y1="154" x2="896" y2="154" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Approve -->
  <rect x="896" y="124" width="240" height="60" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="1016" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">You review &amp; approve</text>
  <text x="1016" y="168" text-anchor="middle" font-size="11" fill="#64748b">nothing unverified is used</text>

  <!-- cached brief feeds retrieval -->
  <path d="M710,184 C710,230 1003,220 1003,282" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="815" y="232" text-anchor="middle" font-size="11" font-style="italic" fill="#6366f1">cached brief feeds retrieval</text>

  <!-- ============ LIVE BAND ============ -->
  <rect x="40" y="248" width="1120" height="352" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="274" font-size="13" font-weight="700" fill="#0f172a">DURING THE INTERVIEW   —   repeated for each question</text>

  <!-- Row 1: stages 1-5 -->
  <!-- node helper: w=190 h=92 y=288 -->
  <!-- 1 Capture -->
  <rect x="60" y="288" width="190" height="92" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="234" cy="306" r="5" fill="#d97706"/>
  <text x="74" y="316" font-size="12.5" font-weight="700" fill="#0f172a">1 · Capture audio</text>
  <text x="74" y="336" font-size="11" fill="#475569">mic — browser</text>
  <text x="74" y="370" font-size="10" font-weight="700" fill="#d97706">PARTIAL (batch)</text>

  <line x1="250" y1="334" x2="272" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 Transcribe -->
  <rect x="272" y="288" width="190" height="92" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="446" cy="306" r="5" fill="#d97706"/>
  <text x="286" y="316" font-size="12.5" font-weight="700" fill="#0f172a">2 · Transcribe</text>
  <text x="286" y="336" font-size="11" fill="#475569">speech → text</text>
  <text x="286" y="352" font-size="11" fill="#475569">(Whisper)</text>
  <text x="286" y="372" font-size="10" font-weight="700" fill="#d97706">PARTIAL (batch)</text>

  <line x1="462" y1="334" x2="484" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 Segment -->
  <rect x="484" y="288" width="190" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="658" cy="306" r="5" fill="#94a3b8"/>
  <text x="498" y="316" font-size="12.5" font-weight="700" fill="#0f172a">3 · Segment / VAD</text>
  <text x="498" y="336" font-size="11" fill="#475569">"question finished?"</text>
  <text x="498" y="372" font-size="10" font-weight="700" fill="#64748b">NOT BUILT</text>

  <line x1="674" y1="334" x2="696" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Classify -->
  <rect x="696" y="288" width="190" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="870" cy="306" r="5" fill="#059669"/>
  <text x="710" y="316" font-size="12.5" font-weight="700" fill="#0f172a">4 · Classify +</text>
  <text x="710" y="332" font-size="12.5" font-weight="700" fill="#0f172a">understand</text>
  <text x="710" y="350" font-size="11" fill="#475569">type &amp; intent</text>
  <text x="710" y="372" font-size="10" font-weight="700" fill="#059669">BUILT (in prompt)</text>

  <line x1="886" y1="334" x2="908" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 Link to JD -->
  <rect x="908" y="288" width="190" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="1082" cy="306" r="5" fill="#059669"/>
  <text x="922" y="316" font-size="12.5" font-weight="700" fill="#0f172a">5 · Link to the JD</text>
  <text x="922" y="336" font-size="11" fill="#475569">retrieve relevant</text>
  <text x="922" y="352" font-size="11" fill="#475569">brief items · no LLM</text>
  <text x="922" y="372" font-size="10" font-weight="700" fill="#059669">BUILT</text>

  <!-- down arrow 5 -> 6a -->
  <line x1="1003" y1="380" x2="1003" y2="452" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: 6a, 6b, 7 (right to left) -->
  <!-- 6a Reason -->
  <rect x="908" y="452" width="220" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="1112" cy="470" r="5" fill="#059669"/>
  <text x="922" y="480" font-size="12.5" font-weight="700" fill="#0f172a">6a · Reason</text>
  <text x="922" y="500" font-size="11" fill="#475569">one LLM call → answer</text>
  <text x="922" y="516" font-size="11" fill="#475569">+ bullets + evidence ids</text>
  <text x="922" y="535" font-size="10" font-weight="700" fill="#059669">BUILT · suggestAnswer()</text>

  <line x1="908" y1="498" x2="730" y2="498" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6b Ground -->
  <rect x="490" y="452" width="220" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="694" cy="470" r="5" fill="#059669"/>
  <text x="504" y="480" font-size="12.5" font-weight="700" fill="#0f172a">6b · Ground / truth filter</text>
  <text x="504" y="500" font-size="11" fill="#475569">drop ungrounded claims,</text>
  <text x="504" y="516" font-size="11" fill="#475569">cap confidence</text>
  <text x="504" y="535" font-size="10" font-weight="700" fill="#059669">BUILT · groundSuggestion()</text>

  <line x1="490" y1="498" x2="312" y2="498" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7 Render -->
  <rect x="72" y="452" width="220" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="276" cy="470" r="5" fill="#059669"/>
  <text x="86" y="480" font-size="12.5" font-weight="700" fill="#0f172a">7 · Render reply</text>
  <text x="86" y="500" font-size="11" fill="#475569">3–5 bullets · evidence</text>
  <text x="86" y="516" font-size="11" fill="#475569">· confidence · verify flag</text>
  <text x="86" y="535" font-size="10" font-weight="700" fill="#059669">BUILT</text>

  <!-- loop back 7 -> 1 (next question) -->
  <path d="M155,452 C155,415 150,400 150,392 L150,382" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="196" y="420" font-size="10.5" font-style="italic" fill="#6366f1">next question</text>

  <!-- ============ LEGEND + LATENCY ============ -->
  <!-- Legend -->
  <rect x="40" y="628" width="330" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="654" font-size="13" font-weight="700" fill="#0f172a">Legend</text>
  <circle cx="68" cy="680" r="6" fill="#059669"/>
  <text x="84" y="684" font-size="12" fill="#334155">Built &amp; unit-tested</text>
  <circle cx="68" cy="710" r="6" fill="#d97706"/>
  <text x="84" y="714" font-size="12" fill="#334155">Partial — works in batch, not streaming</text>
  <circle cx="68" cy="740" r="6" fill="#94a3b8"/>
  <text x="84" y="744" font-size="12" fill="#334155">Not built yet</text>
  <text x="60" y="772" font-size="11" fill="#64748b" font-style="italic">Dashed indigo = cached data / loop</text>

  <!-- Latency -->
  <rect x="386" y="628" width="774" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="406" y="654" font-size="13" font-weight="700" fill="#0f172a">Latency budget — target: first bullet &lt; ~2.5s after the question ends</text>

  <!-- bar: retrieval -->
  <text x="406" y="686" font-size="12" fill="#334155">Retrieval + grounding (pure code)</text>
  <rect x="720" y="677" width="6" height="12" rx="2" fill="#059669"/>
  <text x="900" y="686" font-size="12" fill="#64748b">~5 ms</text>

  <!-- bar: llm -->
  <text x="406" y="714" font-size="12" fill="#334155">LLM suggestion (the only real cost)</text>
  <rect x="720" y="705" width="300" height="12" rx="2" fill="#d97706"/>
  <text x="1030" y="714" font-size="12" fill="#64748b">~1.5–3 s</text>

  <!-- bar: transcribe -->
  <text x="406" y="742" font-size="12" fill="#334155">Transcription (today: batch after Stop)</text>
  <rect x="720" y="733" width="150" height="12" rx="2" fill="#d97706"/>
  <text x="1030" y="742" font-size="12" fill="#64748b">~1–2 s</text>

  <text x="406" y="772" font-size="11" fill="#059669" font-weight="600">Speed levers: pre-cached brief (0 LLM at Q-time) · small context · short max_tokens · streaming STT + token streaming.</text>
</svg>
